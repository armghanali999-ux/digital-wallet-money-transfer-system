<div class="table-responsive"><table class="table"><thead><tr><th>Reference</th><th>Type</th><th>Status</th><th>Amount</th><th>Date</th></tr></thead><tbody>{% for t in transactions %}<tr><td><a href="{% url 'transaction-detail' t.reference %}">{{ t.reference }}</a></td><td>{{ t.type }}</td><td>{{ t.status }}</td><td>{{ t.amount }} {{ t.currency }}</td><td>{{ t.created_at }}</td></tr>{% empty %}<tr><td colspan="5">No transactions found.</td></tr>{% endfor %}</tbody></table></div>
