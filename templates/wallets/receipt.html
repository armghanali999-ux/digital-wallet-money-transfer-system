{% extends 'base.html' %}{% block content %}<div class="card p-4"><h1 class="text-success">Transaction completed</h1><dl><dt>Reference</dt><dd>{{ result.reference }}</dd><dt>Type</dt><dd>{{ result.type }}</dd><dt>Amount</dt><dd>{{ result.amount }} {{ result.currency }}</dd><dt>Status</dt><dd>{{ result.status }}</dd>{% if result.balance %}<dt>Balance</dt><dd>{{ result.balance }}</dd>{% endif %}</dl><a class="btn btn-primary" href="{% url 'dashboard' %}">Dashboard</a></div>{% endblock %}
