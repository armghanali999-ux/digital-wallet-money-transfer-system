{% extends 'base.html' %}
{% block title %}Transactions · Digital Wallet{% endblock %}
{% block content %}
<p class="eyebrow mb-1">Activity</p><h1 class="h2 mb-3">Transaction history</h1>
<form class="card p-3 mb-4" method="get" aria-label="Transaction filters"><div class="row g-3">
<div class="col-md-4"><label class="form-label" for="reference">Reference</label><input class="form-control" id="reference" name="reference" placeholder="Exact or partial reference" value="{{ request.GET.reference }}"></div>
<div class="col-md-4"><label class="form-label" for="type">Type</label><select class="form-select" id="type" name="type"><option value="">All types</option><option value="DEPOSIT" {% if request.GET.type == 'DEPOSIT' %}selected{% endif %}>Deposit</option><option value="WITHDRAWAL" {% if request.GET.type == 'WITHDRAWAL' %}selected{% endif %}>Withdrawal</option><option value="TRANSFER" {% if request.GET.type == 'TRANSFER' %}selected{% endif %}>Transfer</option><option value="BALANCE_ADJUSTMENT" {% if request.GET.type == 'BALANCE_ADJUSTMENT' %}selected{% endif %}>Balance adjustment</option></select></div>
<div class="col-md-4"><label class="form-label" for="status">Status</label><select class="form-select" id="status" name="status"><option value="">All statuses</option><option value="PENDING" {% if request.GET.status == 'PENDING' %}selected{% endif %}>Pending</option><option value="COMPLETED" {% if request.GET.status == 'COMPLETED' %}selected{% endif %}>Completed</option><option value="FAILED" {% if request.GET.status == 'FAILED' %}selected{% endif %}>Failed</option><option value="CANCELLED" {% if request.GET.status == 'CANCELLED' %}selected{% endif %}>Cancelled</option></select></div>
<div class="col-md-3"><label class="form-label" for="start_date">Start date</label><input class="form-control" id="start_date" type="date" name="start_date" value="{{ request.GET.start_date }}"></div><div class="col-md-3"><label class="form-label" for="end_date">End date</label><input class="form-control" id="end_date" type="date" name="end_date" value="{{ request.GET.end_date }}"></div><div class="col-md-3"><label class="form-label" for="min_amount">Minimum amount</label><input class="form-control" id="min_amount" type="number" min="0" step="0.0001" name="min_amount" value="{{ request.GET.min_amount }}"></div><div class="col-md-3"><label class="form-label" for="max_amount">Maximum amount</label><input class="form-control" id="max_amount" type="number" min="0" step="0.0001" name="max_amount" value="{{ request.GET.max_amount }}"></div>
</div><div class="d-flex gap-2 mt-3"><button class="btn btn-primary" type="submit">Apply filters</button><a class="btn btn-outline-secondary" href="{% url 'history' %}">Clear</a></div></form>
{% include 'wallets/transaction_table.html' with transactions=page %}{% include 'partials/pagination.html' with page=page %}
{% endblock %}
